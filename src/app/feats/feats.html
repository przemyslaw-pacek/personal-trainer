<h1>OSIĄGNIĘCIA</h1>
<section class="main">
  @for (feat of feats; track feat.title) {
  <div>
    <div>{{ feat.title }}</div>
    <p>{{ feat.text }}</p>
  </div>
  }
</section>

<h2>OSIĄGNIĘCIA SPORTOWE</h2>
<section class="content">
  <div>
    <img src="assets/gold/medal.jpg" alt="medal" />
    <p>Złoty medal Mr Universe</p>
  </div>
  <div>
    <p>Tytuł mistrza Europy w kulturystyce</p>
    <img src="assets/gold/cup.jpg" alt="cup" />
  </div>
  <div>
    <img src="assets/gold/medals.png" alt="medals" />
    <p>Wielokrotny medalista Mistrzostw Polski w kulturystyce</p>
  </div>
</section>
